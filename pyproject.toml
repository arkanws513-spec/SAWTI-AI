[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sawti-ai"
version = "0.3.0.dev0"
description = "Arabic-first, consent-based personal voice research toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "soundfile>=0.12"]

[project.scripts]
sawti = "sawti.cli:main"

[tool.setuptools.packages.find]
include = ["sawti*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
